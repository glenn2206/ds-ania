<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ania Flower Boutique — Single Screen Cart & Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #FAF8F5;
      --text-main: #111111;
      --text-muted: #888888;
      --border-color: #E2DFD8;
      --border-focus: #111111;
      --btn-bg: #8B9A86; /* Sage green tone from screenshot */
      --btn-hover: #788773;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Inter', -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* Container Fit Single Screen */
    .cart-container {
      max-width: 1100px;
      width: 100%;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 2.5rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
      display: grid;
      grid-template-columns: 1.3fr 1px 1fr;
      gap: 2.5rem;
      align-items: start;
    }

    .divider {
      background-color: var(--border-color);
      height: 100%;
      width: 1px;
    }

    /* Left Section: Items & Sender Info */
    .left-section {
      display: flex;
      flex-direction: flex-col;
      gap: 1.5rem;
    }

    /* Product Row */
    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 1.25rem;
      border-bottom: 1px dashed var(--border-color);
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .remove-icon {
      color: #999;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 2px 6px;
      border: 1px solid #E0E0E0;
      border-radius: 2px;
      transition: all 0.2s;
    }

    .remove-icon:hover {
      color: #d9534f;
      border-color: #d9534f;
    }

    .product-img {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 3px;
    }

    .item-details .title {
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .item-details .subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Quantity Controls */
    .qty-controls {
      display: flex;
      align-items: center;
      border: 1px solid var(--border-color);
      border-radius: 2px;
      overflow: hidden;
    }

    .qty-btn {
      background: none;
      border: none;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-main);
    }

    .qty-input {
      width: 32px;
      text-align: center;
      border: none;
      font-size: 0.85rem;
      outline: none;
    }

    .by-request {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-left: 0.5rem;
    }

    /* Form Fields Grid */
    .form-group-container {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-top: 0.5rem;
    }

    /* Combined Receive on & Send to */
    .inline-delivery-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: #FAF8F5;
    }

    .delivery-col {
      padding: 0.65rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .delivery-col:first-child {
      border-right: 1px solid var(--border-color);
    }

    .delivery-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .delivery-input {
      border: none;
      background: transparent;
      font-size: 0.85rem;
      color: var(--text-main);
      outline: none;
      width: 100%;
      font-family: inherit;
    }

    /* Floating Outlined Input Group */
    .floating-field {
      position: relative;
      width: 100%;
    }

    .floating-input {
      width: 100%;
      padding: 0.85rem 1rem;
      font-size: 0.88rem;
      color: var(--text-main);
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s ease;
      font-family: inherit;
    }

    .floating-label {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      background-color: #FFFFFF;
      padding: 0 0.35rem;
      color: var(--text-muted);
      font-size: 0.82rem;
      pointer-events: none;
      transition: all 0.2s ease;
    }

    /* Focus & Has Value Animation */
    .floating-input:focus,
    .floating-input:not(:placeholder-shown) {
      border-color: var(--border-focus);
    }

    .floating-input:focus + .floating-label,
    .floating-input:not(:placeholder-shown) + .floating-label {
      top: 0;
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--text-main);
      letter-spacing: 0.03em;
    }

    /* Hide standard browser placeholder until focused */
    .floating-input::placeholder {
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .floating-input:focus::placeholder {
      opacity: 0.5;
    }

    /* Two Columns Form Layout for Contact Info */
    .form-row-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    /* Right Section: Cart Totals */
    .right-section {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .continue-btn {
      width: 100%;
      padding: 0.85rem;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      border-radius: 3px;
    }

    .continue-btn:hover {
      border-color: var(--text-main);
    }

    .summary-card {
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 1.5rem;
      background-color: #FAF8F5;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .summary-title {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 400;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .summary-row.total {
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
      color: var(--text-main);
      font-weight: 600;
      font-size: 1rem;
    }

    .checkout-btn {
      width: 100%;
      padding: 1.05rem;
      background-color: var(--btn-bg);
      border: none;
      color: #FFFFFF;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-weight: 500;
      cursor: pointer;
      border-radius: 3px;
      transition: background-color 0.2s ease;
      margin-top: 0.5rem;
    }

    .checkout-btn:hover {
      background-color: var(--btn-hover);
    }

    @media (max-width: 868px) {
      .cart-container {
        grid-template-columns: 1fr;
      }
      .divider {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="cart-container">
    
    <!-- Left Column: Items + Floating Form -->
    <div class="left-section">
      
      <!-- Cart Item -->
      <div class="cart-item">
        <div class="item-info">
          <span class="remove-icon" title="Remove">✕</span>
          <img src="https://images.unsplash.com/photo-1563241527-3004b7be0ffd?w=120&auto=format&fit=crop&q=80" alt="Azure Bloom" class="product-img">
          <div class="item-details">
            <div class="title">Azure Bloom</div>
            <div class="subtitle">Premium Wrapped</div>
          </div>
        </div>

        <div style="display: flex; align-items: center;">
          <div class="qty-controls">
            <button class="qty-btn">-</button>
            <input type="text" value="1" class="qty-input">
            <button class="qty-btn">+</button>
          </div>
          <span class="by-request">By request</span>
        </div>
      </div>

      <!-- Form Inputs Grid -->
      <div class="form-group-container">
        
        <!-- Combined Delivery & Location Bar -->
        <div class="inline-delivery-box">
          <div class="delivery-col">
            <span class="delivery-label">Receive on:</span>
            <input type="date" value="2026-10-01" class="delivery-input">
          </div>
          <div class="delivery-col">
            <span class="delivery-label">Send to:</span>
            <input type="text" placeholder="Type district / area — e.g." class="delivery-input">
          </div>
        </div>

        <!-- Sender Name (Floating Outlined Label) -->
        <div class="floating-field">
          <input type="text" id="sender-name" class="floating-input" placeholder="Full name">
          <label for="sender-name" class="floating-label">Sender Name:</label>
        </div>

        <!-- 2 Columns: WhatsApp & Email -->
        <div class="form-row-2col">
          <div class="floating-field">
            <input type="tel" id="sender-wa" class="floating-input" placeholder="(+62) 81212349876">
            <label for="sender-wa" class="floating-label">Sender WhatsApp:</label>
          </div>

          <div class="floating-field">
            <input type="email" id="sender-email" class="floating-input" placeholder="you@email.com">
            <label for="sender-email" class="floating-label">Sender Email:</label>
          </div>
        </div>

      </div>

    </div>

    <!-- Center Divider -->
    <div class="divider"></div>

    <!-- Right Column: Cart Totals Summary -->
    <div class="right-section">
      <button class="continue-btn">Continue Shopping?</button>

      <div class="summary-card">
        <h2 class="summary-title">Cart Totals</h2>
        
        <div class="summary-row">
          <span>Subtotal</span>
          <span>Rp 0</span>
        </div>

        <div class="summary-row">
          <span>Delivery</span>
          <span>—</span>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <span>Rp 0</span>
        </div>

        <button class="checkout-btn">Proceed to Checkout — Rp 0</button>
      </div>
    </div>

  </div>

</body>
</html>
