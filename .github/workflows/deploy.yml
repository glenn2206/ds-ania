name: Build check

# Deployment dijalankan oleh cron cPanel karena akun hosting tidak memiliki shell/SSH.
# Workflow ini memastikan commit di main tetap dapat dibangun sebelum cron mengambilnya.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  repository_dispatch:
    types: [publish]
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (Astro SSR)
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
